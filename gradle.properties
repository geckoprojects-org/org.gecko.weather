# bnd 7.3.0 shipped a regression in the -pom snapshot handling (PomResource.doSnapshot
# parsed the Maven version "x.y.z-SNAPSHOT" as an OSGi version and threw), which broke
# bundle jar builds with the fennec library. Fixed in 7.4.0.
bnd_version=7.4.0

# Keep the Gradle output dir from being auto-discovered as a bnd project.
# The bnd workspace plugin sweeps all root folders (except dot-folders, buildSrc, gradle)
# into the project graph; 'build' is not in its SPECIAL_FOLDERS, so exclude it explicitly.
bnd_exclude=build,docs,docs-site,ui

# --- Project coordinates (single source of truth) ---
# Used by Gradle directly and imported into bnd via `-include` in cnf/ext/fennec.bnd.
# Adjust these per project (see cnf/SETUP.MD). The Maven group id must start with org.eclipse.fennec.
github_org=geckoprojects-org
github_repository=org.gecko.weather
maven_group_id=org.geckoprojects.weather
